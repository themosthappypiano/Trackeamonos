<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traquea Monos (Secret)</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./vest-self-app.js" type="module"></script>
  <!-- Chatbot Injection -->
<!-- AI Developer Bot Modal -->
<div id="ai-bot-window" style="display: none; position: fixed; bottom: 80px; left: 20px; z-index: 10000; width: 340px; height: 450px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 1px solid #eee; overflow: hidden; flex-direction: column;">
  <div style="background: #000; color: white; padding: 16px; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; flex-shrink: 0;">
    <span>App Feature Developer ✨</span>
    <button id="ai-bot-close" style="background: none; border: none; color: white; cursor: pointer;">✕</button>
  </div>
  
  <div id="ai-chat-history" style="flex-grow: 1; padding: 16px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 12px; font-size: 13px;">
    <div style="align-self: flex-start; background: #e5e7eb; padding: 10px 14px; border-radius: 12px; border-bottom-left-radius: 2px; color: #111827; max-width: 85%; line-height: 1.4;">
      Hi! I'm your AI Developer. Tell me what feature to build or change, and I'll push the code to GitHub directly!
    </div>
  </div>

  <div style="padding: 12px; background: white; border-top: 1px solid #eee; flex-shrink: 0; display: flex; gap: 8px;">
    <input type="text" id="ai-bot-input" placeholder="Message the AI..." style="flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; font-family: inherit; font-size: 13px; outline: none;" autocomplete="off" />
    <button id="ai-bot-submit" style="background: #000; color: white; border: none; padding: 0 16px; border-radius: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;">
      ↑
    </button>
  </div>
</div>

<script>
  // Add delegated listener for the toggle button since it is dynamically rendered
  document.addEventListener('click', (e) => {
    if (e.target.closest('#ai-bot-toggle')) {
      const chatWindow = document.getElementById('ai-bot-window');
      const isHidden = chatWindow.style.display === 'none';
      chatWindow.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) document.getElementById('ai-bot-input').focus();
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const chatWindow = document.getElementById('ai-bot-window');
    const submitBtn = document.getElementById('ai-bot-submit');
    const inputField = document.getElementById('ai-bot-input');
    const chatHistory = document.getElementById('ai-chat-history');
    const closeBtn = document.getElementById('ai-bot-close');

    function addMessage(text, isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.style.padding = '10px 14px';
      msgDiv.style.borderRadius = '12px';
      msgDiv.style.maxWidth = '85%';
      msgDiv.style.lineHeight = '1.4';
      msgDiv.style.wordBreak = 'break-word';
      
      if (isUser) {
        msgDiv.style.alignSelf = 'flex-end';
        msgDiv.style.background = '#10b981';
        msgDiv.style.color = 'white';
        msgDiv.style.borderBottomRightRadius = '2px';
      } else {
        msgDiv.style.alignSelf = 'flex-start';
        msgDiv.style.background = '#e5e7eb';
        msgDiv.style.color = '#111827';
        msgDiv.style.borderBottomLeftRadius = '2px';
      }
      
      msgDiv.textContent = text;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    closeBtn.addEventListener('click', () => {
      chatWindow.style.display = 'none';
    });

    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });

    submitBtn.addEventListener('click', async () => {
      const prompt = inputField.value.trim();
      if (!prompt) return;

      inputField.value = '';
      inputField.disabled = true;
      submitBtn.disabled = true;
      
      addMessage(prompt, true);
      
      const typingId = 'typing-' + Date.now();
      const typingDiv = document.createElement('div');
      typingDiv.id = typingId;
      typingDiv.style.alignSelf = 'flex-start';
      typingDiv.style.fontSize = '12px';
      typingDiv.style.color = '#6b7280';
      typingDiv.textContent = 'AI is writing code...';
      chatHistory.appendChild(typingDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;

      try {
        const response = await fetch('https://n8n.themosthappypiano.me/webhook/ai-feature-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: prompt,
            repo: 'Trackeamonos',
            timestamp: new Date().toISOString()
          })
        });

        document.getElementById(typingId).remove();
        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          addMessage(data.output || data.message || '✨ Done. The request completed successfully.', false);
        } else {
          throw new Error(data.message || `Workflow failed with status ${response.status}`);
        }
      } catch (error) {
        document.getElementById(typingId)?.remove();
        addMessage(`❌ ${error.message || 'Could not connect to the AI developer.'}`, false);
      } finally {
        inputField.disabled = false;
        submitBtn.disabled = false;
        inputField.focus();
      }
    });
  });
</script>

  </body>
</html>
