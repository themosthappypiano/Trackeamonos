<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traquea Monos (Secret)</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./kayla-app.js" type="module"></script>
  <!-- Chatbot Injection -->
<!-- AI Developer Bot Modal -->
<div id="ai-bot-window" style="display: none; position: fixed; bottom: 80px; left: 20px; z-index: 10000; width: 320px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 1px solid #eee; overflow: hidden; flex-direction: column;">
  <div style="background: #000; color: white; padding: 16px; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between;">
    <span>App Feature Developer ✨</span>
    <button id="ai-bot-close" style="background: none; border: none; color: white; cursor: pointer;">✕</button>
  </div>
  <div style="padding: 16px; font-size: 14px; color: #333; line-height: 1.5;">
    <p style="margin-top: 0;">Hi! Want to add a new feature or change something in the app?</p>
    <textarea id="ai-bot-input" placeholder="e.g. Add a dark mode toggle to the top right corner..." style="width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 8px; font-family: inherit; font-size: 13px; resize: none; box-sizing: border-box;"></textarea>
    <button id="ai-bot-submit" style="width: 100%; background: #000; color: white; border: none; padding: 10px; border-radius: 8px; margin-top: 12px; font-weight: 600; cursor: pointer;">
      Request Feature
    </button>
    <div id="ai-bot-status" style="margin-top: 8px; font-size: 12px; color: #666; text-align: center; display: none;"></div>
  </div>
</div>

<script>
  // Add delegated listener for the toggle button since it is dynamically rendered
  document.addEventListener('click', (e) => {
    if (e.target.closest('#ai-bot-toggle')) {
      const chatWindow = document.getElementById('ai-bot-window');
      const isHidden = chatWindow.style.display === 'none';
      chatWindow.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) document.getElementById('ai-bot-input').focus();
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    const chatWindow = document.getElementById('ai-bot-window');
    const submitBtn = document.getElementById('ai-bot-submit');
    const inputField = document.getElementById('ai-bot-input');
    const statusDiv = document.getElementById('ai-bot-status');
    const closeBtn = document.getElementById('ai-bot-close');

    closeBtn.addEventListener('click', () => {
      chatWindow.style.display = 'none';
    });

    submitBtn.addEventListener('click', async () => {
      const prompt = inputField.value.trim();
      if (!prompt) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      statusDiv.style.display = 'block';
      statusDiv.textContent = 'Submitting request to n8n webhook...';

      try {
        const response = await fetch('http://31.97.53.186:5678/webhook/ai-feature-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            prompt: prompt,
            repo: 'Trackeamonos',
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          inputField.value = '';
          statusDiv.style.color = '#10b981';
          statusDiv.textContent = '✨ Request sent! The AI is coding it now.';
          setTimeout(() => {
            chatWindow.style.display = 'none';
            statusDiv.style.display = 'none';
          }, 3000);
        } else {
          throw new Error('Network response was not ok');
        }
      } catch (error) {
        statusDiv.style.color = '#ef4444';
        statusDiv.textContent = 'Error: Make sure your n8n webhook is active.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Request Feature';
      }
    });
  });
</script>

  </body>
</html>
