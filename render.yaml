services:
  - type: web
    name: traquea-monos
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /vest-self.html
        destination: /vest-self.html
      - type: rewrite
        source: /kayla.html
        destination: /kayla.html
      - type: rewrite
        source: /*
        destination: /index.html
